# CI Runner Farm - "fern-sim" profile
# Flutter analyze/test + Android appbundle builds on Unraid.
# Dockerfile: profiles/fern-sim.Dockerfile

GH_SCOPE="repo"
GH_OWNER="dbrieck"
GH_REPOS="dbrieck/fern-sim"
RUNNER_COUNT="1"
RUNNER_LABELS="self-hosted,linux,x64,fern-sim"
RUNNER_MEMORY="16g"
IMAGE_SOURCE="builtin"
DIND="true"
EPHEMERAL="false"
RUN_AS_ROOT="true"
CACHE_ROOT="/mnt/cache/github-runner"
CACHE_MOUNTS="pub-cache:/root/.pub-cache gradle:/root/.gradle android-sdk:/opt/android-sdk"
