# CI Runner Farm - "opencode-mobile" profile
# Copy to /boot/config/plugins/ci-runner-farm/opencode-mobile.cfg (or use
# "+ Add profile" in the web UI and fill in the same values), then also copy
# opencode-mobile.Dockerfile to
# /boot/config/plugins/ci-runner-farm/opencode-mobile.Dockerfile (or paste it
# into the Runner image builder for this profile), Build, set this profile's
# GitHub token, and Start it. Any key not listed here uses the same built-in
# defaults as the "default" profile (see default.cfg at the repo root for the
# full reference list).

GH_SCOPE="repo"
GH_OWNER="dbrieck"
GH_REPOS="dbrieck/opencode-mobile"
RUNNER_COUNT="1"
RUNNER_LABELS="self-hosted,linux,x64,opencode-mobile"

# host-subdir:container-path, mounted under this profile's cache namespace
# (/mnt/<pool>/<cache-root>/opencode-mobile/... — see PROFILES.md). The
# non-root 'runner' user (RUN_AS_ROOT=false, the default) owns all three via
# ensure_dirs' RUNNER_UID:RUNNER_GID chown, including android-sdk even though
# its container path isn't under /home/runner.
CACHE_MOUNTS="npm:/home/runner/.npm gradle:/home/runner/.gradle android-sdk:/opt/android-sdk"
