# CI Runner Farm - "opencode-mobile" profile
# Serves dbrieck/opencode-mobile only (fern-sim has its own Flutter profile).
# Dockerfile: profiles/opencode-mobile.Dockerfile (bake SDK + seed wrapper).
#
# Tuned for a ~24GB Unraid host with a pool-backed CACHE_ROOT:
# - one runner (Android + Playwright must not overlap on the same box)
# - DIND off (workflows do not use Docker; DinD burns disk/RAM)
# - empty WORK_TMPFS_SIZE so /_work bind-mounts to the pool (not RAM/docker.img)

GH_SCOPE="repo"
GH_OWNER="dbrieck"
GH_REPOS="dbrieck/opencode-mobile"
RUNNER_COUNT="1"
RUNNER_LABELS="self-hosted,linux,x64,opencode-mobile"
RUNNER_MEMORY="16g"
IMAGE_SOURCE="builtin"
DIND="false"
EPHEMERAL="false"
WORK_TMPFS_SIZE=""

# Match the old compose caches under /root (image installs Go/npm as root).
RUN_AS_ROOT="true"
CACHE_ROOT="/mnt/disk1/runner-cache"
CACHE_MOUNTS="npm:/root/.npm gradle:/root/.gradle android-sdk:/opt/android-sdk"