# CI Runner Farm - "thisprop" profile
# Copy to /boot/config/plugins/ci-runner-farm/thisprop.cfg (or use "+ Add
# profile" in the web UI and fill in the same values), then set this
# profile's GitHub token and Start it. Any key not listed here uses the same
# built-in defaults as the "default" profile (see default.cfg at the repo
# root for the full reference list).

GH_SCOPE="repo"
GH_OWNER="dbrieck"
GH_REPOS="dbrieck/ThisProp"
RUNNER_COUNT="2"
RUNNER_LABELS="self-hosted,linux,x64,thisprop"

# Jobs run as root: the caches below are rooted at /root, which the default
# non-root 'runner' user can't even traverse. Set true only because this
# profile's caches target /root — leave false (the recommended default) if
# yours don't.
RUN_AS_ROOT="true"

# host-subdir:container-path, mounted under this profile's cache namespace
# (/mnt/<pool>/<cache-root>/thisprop/... — see PROFILES.md).
CACHE_MOUNTS="nuget:/root/.nuget npm:/root/.npm firebase:/root/.cache/firebase/emulators"
