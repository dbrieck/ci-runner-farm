# CI Runner Farm - "thisprop" profile
# dbrieck/ThisProp — Node, .NET/MAUI, Firebase, Android.
# Dockerfile: profiles/thisprop.Dockerfile

GH_SCOPE="repo"
GH_OWNER="dbrieck"
GH_REPOS="dbrieck/ThisProp"
RUNNER_COUNT="2"
RUNNER_LABELS="self-hosted,linux,x64,thisprop"
RUNNER_MEMORY="16g"
IMAGE_SOURCE="builtin"
DIND="true"
